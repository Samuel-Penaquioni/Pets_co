<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script>document.documentElement.classList.add('js');setTimeout(function(){document.documentElement.classList.add('ok')},4000)</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="assets/images/cachorro-parado.webp" />
  <link rel="preload" as="image" href="assets/images/petsco-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produtos — Pets’co</title>
  <meta name="description" content="Rações, petiscos, brinquedos e acessórios para cães e gatos." />
  <link rel="icon" href="assets/images/petsco-logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind.config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="produtos">
  <main id="main">
    <header class="hero pt-h px-4 pb-14 rounded-b-[2.5rem]">
      <div class="max-w-6xl mx-auto flex items-center justify-between gap-6">
        <div>
          <h1 class="text-4xl md:text-5xl font-bold text-gd">Produtos</h1>
          <p class="mt-3 text-lg text-gd/80 max-w-xl">Rações, petiscos, brinquedos e acessórios para cães e gatos. Compre e receba em casa.</p>
        </div>
        <span class="hidden md:block text-[7rem] leading-none fl" aria-hidden="true">🛍️</span>
      </div>
    </header>
    <section class="max-w-6xl mx-auto px-4 py-10">
      <div class="grid md:grid-cols-4 gap-3">
        <div class="md:col-span-2"><label class="lbl" for="q">Buscar produto</label><input id="q" type="search" class="inp" placeholder="Ex.: ração, bolinha, shampoo"></div>
        <div><label class="lbl" for="pet">Para quem?</label><select id="pet" class="inp"><option>Todos</option><option>Cães</option><option>Gatos</option></select></div>
        <div><label class="lbl" for="ord">Ordenar</label><select id="ord" class="inp"><option value="">Em destaque</option><option value="asc">Menor preço</option><option value="desc">Maior preço</option></select></div>
      </div>
      <div id="chips" class="flex flex-wrap gap-2 mt-5" role="group" aria-label="Categorias"></div>
      <p id="count" class="text-sm text-gd/70 mt-6 mb-3" aria-live="polite"></p>
      <div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-5"></div>
    </section>
  </main>
  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="pages.js"></script>
</body>
</html>
